
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Position Text on Image</title>

<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  width: 100%;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
}
.container {
  position: relative;
  width: 100vw;
  height: 100vh;
}

.container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.5;
  display: block;
}

.text {
  position: absolute;
  font-size: 20px;
  font-weight: bold;
}

.topleft {
  top: 8px;
  left: 16px;
}

.topcenter {
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
}

.topright {
  top: 8px;
  right: 16px;
}

.leftcenter {
  top: 50%;
  left: 16px;
  transform: translateY(-50%);
}

.center {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.rightcenter {
  top: 50%;
  right: 16px;
  transform: translateY(-50%);
}

.bottomleft {
  bottom: 8px;
  left: 16px;
}

.bottomcenter {
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
}

.bottomright {
  bottom: 8px;
  right: 16px;
}
</style>
</head>

<body>

<div class="container">
  <img src="image.png" alt="My Image">

  <div class="text topleft">OMKAR</div>
  <div class="text topcenter">OMKAR</div>
  <div class="text topright">OMKAR</div>

  <div class="text leftcenter">OMKAR</div>
  <div class="text center">OMKAR</div>
  <div class="text rightcenter">OMKAR</div>

  <div class="text bottomleft">OMKAR</div>
  <div class="text bottomcenter">OMKAR</div>
  <div class="text bottomright">OMKAR</div>
</div>

</body>
</html>
